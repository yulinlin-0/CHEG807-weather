name: CHEG807 Tacoma Forecast and Historical Weather

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "test = artifacts only; collect = commit CSV and PNG to GitHub"
        type: choice
        required: true
        default: test
        options:
          - test
          - collect
      task:
        description: "forecast (daily) or history (occasional 30-day query)"
        type: choice
        required: true
        default: forecast
        options:
          - forecast
          - history

permissions:
  contents: write

concurrency:
  group: cheg807-tacoma-weather
  cancel-in-progress: false

jobs:
  collect-tacoma:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install plot dependency
        run: python -m pip install -r requirements-tacoma.txt

      - name: Acquire weather and generate CSV and PNG
        env:
          MODE: ${{ inputs.mode }}
          TASK: ${{ inputs.task }}
        run: |
          if [ "$TASK" = "history" ]; then
            python collect_tacoma_history.py --mode "$MODE" --days 30
          else
            python collect_tacoma.py --mode "$MODE"
          fi

      - name: Upload test CSV and PNG artifacts
        if: inputs.mode == 'test'
        uses: actions/upload-artifact@v4
        with:
          name: tacoma-${{ inputs.task }}-preview
          path: test-output/tacoma/
          if-no-files-found: error

      - name: Commit official CSV and PNG
        if: inputs.mode == 'collect'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tacoma/
          if git diff --cached --quiet; then
            echo "No new official outputs."
          else
            git commit -m "Archive Tacoma weather data and plots [skip ci]"
            git pull --rebase
            git push
          fi
